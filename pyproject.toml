[project]
name = "agent-analyst"
version = "1.0.0"
description = "Agent Analyst - AI Growth Automation System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
    "langfuse>=4.0.0",
    "litellm>=1.40.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "tenacity>=8.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]

[tool.setuptools]
# On spécifie explicitement les packages à inclure
packages = ["agents", "common", "config", "migrations", "scripts", "tests"]

[tool.setuptools.package-dir]
agents = "agents"
common = "common"
config = "config"
migrations = "migrations"
scripts = "scripts"
tests = "tests"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
